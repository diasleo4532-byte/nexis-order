[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nexis-order"
version = "0.1.0"
description = "Nexis Order - a local-first, voice-controlled personal AI agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "playwright>=1.45",
]

[project.optional-dependencies]
voice = [
    "edge-tts>=6.1",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
]
whisper = [
    "faster-whisper>=1.0",
]
app = [
    "starlette>=0.37",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
nexis = "nexis.cli:main"
nexis-app = "nexis.app:main"

[tool.setuptools.packages.find]
include = ["nexis*"]

[tool.setuptools.package-data]
"nexis.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
